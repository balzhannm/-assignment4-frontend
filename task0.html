<main class="container page-wrap"><div class="form-card"><span class="eyebrow">PART 1 · TASK 0</span><h1>Simple Contact Form</h1><p class="text-secondary">Send a message using the form below.</p>
<form id="contactForm" action="#" method="get">
  <div class="mb-3"><label for="name" class="form-label">Name</label><input id="name" name="name" type="text" class="form-control" placeholder="Your name"></div>
  <div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" name="email" type="email" class="form-control" placeholder="name@example.com"></div>
  <div class="mb-3"><label for="message" class="form-label">Message</label><textarea id="message" name="message" class="form-control" rows="4" placeholder="Write your message"></textarea></div>
  <button class="btn btn-primary" type="submit">Submit</button><p class="small text-secondary mt-3 mb-0">This basic example demonstrates labels and form fields.</p>
</form></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
