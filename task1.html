<main class="container page-wrap"><div class="form-card"><span class="eyebrow">PART 1 · TASK 1</span><h1>Form with HTML5 Validation</h1><p class="text-secondary">Try submitting an empty form or entering an invalid email address.</p>
<form action="#" method="get">
<div class="mb-3"><label for="name" class="form-label">Name <span class="text-danger">*</span></label><input id="name" name="name" type="text" class="form-control" placeholder="Your name" required minlength="2" maxlength="50"></div>
<div class="mb-3"><label for="email" class="form-label">Email <span class="text-danger">*</span></label><input id="email" name="email" type="email" class="form-control" placeholder="name@example.com" required maxlength="100"></div>
<div class="mb-3"><label for="message" class="form-label">Message <span class="text-danger">*</span></label><textarea id="message" name="message" class="form-control" rows="4" placeholder="At least 10 characters" required minlength="10" maxlength="500"></textarea><div class="form-text">Message must contain 10–500 characters.</div></div>
<button class="btn btn-primary" type="submit">Validate and Submit</button><button class="btn btn-outline-secondary ms-2" type="reset">Reset</button>
</form></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
