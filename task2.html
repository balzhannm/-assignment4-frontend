<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Task 2 | Bootstrap Form</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark site-nav"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Forms Lab</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav ms-auto"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="task0.html">Task 0</a><a class="nav-link" href="task1.html">Task 1</a><a class="nav-link active" href="task2.html">Task 2</a><a class="nav-link" href="task3.html">Task 3</a><a class="nav-link" href="task4.html">Task 4</a></div></div></div></nav>
<main class="container page-wrap"><div class="form-card"><span class="eyebrow">PART 2 · TASK 2</span><h1>Bootstrap Contact Form</h1><p class="text-secondary">A responsive layout using Bootstrap grid and form classes.</p>
<form action="#" method="get">
<div class="row g-3"><div class="col-md-6"><label for="name" class="form-label">Name</label><input id="name" name="name" class="form-control" type="text" placeholder="e.g. Alex Morgan" required></div>
<div class="col-md-6"><label for="email" class="form-label">Email address</label><input id="email" name="email" class="form-control" type="email" placeholder="name@example.com" required><div class="form-text">We will use this to reply to you.</div></div>
<div class="col-12"><label for="topic" class="form-label">Topic</label><select id="topic" name="topic" class="form-select" required><option value="" selected disabled>Choose a topic</option><option>General question</option><option>Feedback</option><option>Support</option></select></div>
<div class="col-12"><label for="message" class="form-label">Message</label><textarea id="message" name="message" class="form-control" rows="4" placeholder="How can we help?" required minlength="10"></textarea><div class="form-text">Please write at least 10 characters.</div></div>
<div class="col-12"><button class="btn btn-primary" type="submit">Send message</button></div></div>
</form></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
